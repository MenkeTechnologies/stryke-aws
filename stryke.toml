[package]
name = "stryke-aws"
version = "0.2.1"
description = "AWS client (S3, DynamoDB, SQS, Lambda, STS) for stryke. cdylib loaded in-process — persistent tokio runtime + SdkConfig cache per region. v0.2.0 focused subset; remaining ops can be added incrementally."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-aws"
edition = "2026"

[ffi]
lib-name = "stryke_aws"
namespace = "AWS"
exports = [
    "aws__pkg_version",
    "aws__sts_caller_identity",
    "aws__s3_list_buckets",
    "aws__s3_list_objects",
    "aws__s3_get_object",
    "aws__s3_put_object",
    "aws__s3_delete_object",
    "aws__ddb_list_tables",
    "aws__ddb_put_item",
    "aws__ddb_get_item",
    "aws__sqs_list_queues",
    "aws__sqs_send_message",
    "aws__sqs_receive_message",
    "aws__sqs_delete_message",
    "aws__lambda_invoke",
    "aws__lambda_list_functions",
    "aws__s3_head_object",
    "aws__ddb_delete_item",
    "aws__ddb_query",
    "aws__ddb_scan",
    "aws__ddb_describe_table",
    "aws__sqs_purge_queue",
    "aws__sqs_get_queue_attributes",
    "aws__sts_assume_role",
]

[scripts]
build = "cargo build --release"
build-debug = "cargo build"
clean = "cargo clean"
test = "s test t/"
install = "s pkg install -g ."
