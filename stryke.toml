[package]
name = "stryke-aws"
version = "0.19.0"
description = "AWS client (S3, DynamoDB, SQS, Lambda, STS, SNS, SSM, Secrets Manager, SES, CloudWatch, CloudWatch Logs, EC2, KMS, IAM, Kinesis, ECR, Step Functions) for stryke. cdylib loaded in-process — persistent tokio runtime + SdkConfig cache per region."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-aws"
edition = "2026"

[ffi]
lib-name = "stryke_aws"
namespace = "AWS"
exports = [
    "aws__pkg_version",
    "aws__sts_caller_identity",
    "aws__s3_list_buckets",
    "aws__s3_list_objects",
    "aws__s3_get_object",
