[package]
name = "stryke-aws"
version = "0.19.0"
description = "AWS client (S3, DynamoDB, SQS, Lambda, STS, SNS, SSM Parameter Store, Secrets Manager) for stryke. cdylib loaded in-process — persistent tokio runtime + SdkConfig cache per region."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-aws"
edition = "2026"

[ffi]
lib-name = "stryke_aws"
namespace = "AWS"
exports = [
    "aws__pkg_version",
    "aws__sts_caller_identity",
    "aws__s3_list_buckets",
    "aws__s3_list_objects",
    "aws__s3_get_object",
    "aws__s3_put_object",
    "aws__s3_delete_object",
    "aws__ddb_list_tables",
    "aws__ddb_put_item",
    "aws__ddb_get_item",
    "aws__sqs_list_queues",
    "aws__sqs_send_message",
    "aws__sqs_receive_message",
    "aws__sqs_delete_message",
    "aws__lambda_invoke",
    "aws__lambda_list_functions",
    "aws__s3_head_object",
    "aws__ddb_delete_item",
    "aws__ddb_query",
    "aws__ddb_scan",
    "aws__ddb_describe_table",
    "aws__sqs_purge_queue",
    "aws__sqs_get_queue_attributes",
    "aws__sts_assume_role",
    "aws__s3_copy_object",
    "aws__s3_delete_objects",
    "aws__ddb_update_item",
    "aws__ddb_batch_get_item",
    "aws__ddb_batch_write_item",
    "aws__sns_list_topics",
    "aws__sns_publish",
    "aws__sns_create_topic",
    "aws__sns_subscribe",
    "aws__ssm_get_parameter",
    "aws__ssm_put_parameter",
    "aws__ssm_get_parameters_by_path",
    "aws__ssm_delete_parameter",
    "aws__secrets_get_value",
    "aws__secrets_create",
    "aws__secrets_put_value",
    "aws__secrets_list",
    "aws__ses_send_email",
    "aws__cloudwatch_put_metric",
    "aws__cloudwatch_list_metrics",
    "aws__parse_arn",
    "aws__build_arn",
    "aws__parse_s3_uri",
    "aws__build_s3_uri",
    "aws__s3_uri_to_arn",
    "aws__arn_to_s3_uri",
    "aws__valid_bucket_name",
    "aws__valid_s3_key",
    "aws__valid_sqs_queue_name",
    "aws__valid_account_id",
    "aws__valid_arn",
    "aws__arn_matches",
    "aws__partition_for_region",
    "aws__valid_region",
    "aws__dns_suffix_for_partition",
    "aws__service_endpoint",
    "aws__parse_service_endpoint",
    "aws__s3_object_url",
    "aws__parse_s3_url",
    "aws__region_for_az",
]

[scripts]
build = "cargo build --release"
build-debug = "cargo build"
clean = "cargo clean"
test = "s test t/"
install = "s pkg install -g ."
