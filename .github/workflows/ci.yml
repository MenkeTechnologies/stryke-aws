name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-fail-fast

  helper-localstack:
    name: Helper smoke (LocalStack)
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3,dynamodb,sqs,lambda,sts
          DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566
        options: >-
          --health-cmd="curl -sf http://localhost:4566/_localstack/health"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://127.0.0.1:4566
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked

      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 60); do
            curl -sf "$AWS_ENDPOINT_URL/_localstack/health" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "LocalStack never came up" >&2
          exit 1

      - name: STS caller-identity
        run: ./target/release/stryke-aws-helper sts caller-identity | jq -e '.account'

      - name: S3 round-trip
        run: |
          set -euo pipefail
          H=./target/release/stryke-aws-helper
          # `aws` CLI is preinstalled on ubuntu-latest; it speaks SigV4 to
          # LocalStack with the dummy `test/test` credentials we set above.
          aws --endpoint-url "$AWS_ENDPOINT_URL" s3 mb s3://stryke-ci-bucket
          echo "hello" | $H s3 put s3://stryke-ci-bucket/hello.txt --input=- | jq -e '.key == "hello.txt"'
          $H s3 head s3://stryke-ci-bucket/hello.txt | jq -e '.size > 0'
          $H s3 get  s3://stryke-ci-bucket/hello.txt | tr -d '\n' | grep -x hello
          $H s3 ls   s3://stryke-ci-bucket/ | grep hello.txt
          $H s3 rm   s3://stryke-ci-bucket/hello.txt | jq -e '.deleted == true'
          $H s3 buckets | jq -e '.name == "stryke-ci-bucket"'

      - name: DynamoDB round-trip
        run: |
          set -euo pipefail
          H=./target/release/stryke-aws-helper
          aws --endpoint-url "$AWS_ENDPOINT_URL" dynamodb create-table \
            --table-name t \
            --attribute-definitions AttributeName=id,AttributeType=S \
            --key-schema AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST >/dev/null
          $H ddb put t --item='{"id":"a","name":"alice","score":1.5}' | jq -e '.ok == true'
          $H ddb get t --key='{"id":"a"}' | jq -e '.name == "alice" and .score == 1.5'
          # Query streams NDJSON rows — first line is the row.
          $H ddb query t --expr='id = :id' --vals='{":id":"a"}' | head -1 | jq -e '.id == "a"'
          $H ddb delete t --key='{"id":"a"}' | jq -e '.ok == true'

      - name: SQS round-trip
        run: |
          set -euo pipefail
          H=./target/release/stryke-aws-helper
          Q=$(aws --endpoint-url "$AWS_ENDPOINT_URL" sqs create-queue --queue-name ci-q | jq -r .QueueUrl)
          $H sqs send "$Q" --body='hello-ci' | jq -e '.message_id'
          # SQS may need a moment to make the message visible — long-poll for it.
          $H sqs receive "$Q" --max=1 --wait=10 | head -1 | jq -e '.body == "hello-ci"'

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

  release-build:
    name: Release Build (${{ matrix.target }})
    needs: [check, test, helper-localstack]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: stryke-aws-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/stryke-aws-helper
