[package]
name = "stryke-aws"
version = "0.16.0"
edition = "2021"
description = "AWS SDK cdylib for the stryke `aws` package — dlopened in-process via stryke's FFI bridge"
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-aws"
homepage = "https://menketechnologies.github.io/stryke-aws/"
publish = false

[lib]
name = "stryke_aws"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-dynamodb = "1"
aws-sdk-sqs = "1"
aws-sdk-lambda = "1"
aws-sdk-sts = "1"
aws-sdk-sns = "1"
aws-sdk-ssm = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-sesv2 = "1"
aws-types = "1"
aws-smithy-types = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
base64 = "0.22"
once_cell = "1"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
