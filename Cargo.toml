[package]
name = "stryke-aws"
version = "0.19.0"
edition = "2021"
description = "AWS SDK cdylib for the stryke `aws` package — dlopened in-process via stryke's FFI bridge"
authors = ["MenkeTechnologies <linux.dev25@gmail.com>"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-aws"
homepage = "https://menketechnologies.github.io/stryke-aws/"
publish = false

[lib]
name = "stryke_aws"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# `rustls` is a DEFAULT feature of every aws-sdk-* crate and it selects the LEGACY
# TLS stack: aws-sdk-*/rustls -> aws-smithy-runtime/tls-rustls ->
# aws-smithy-http-client/legacy-rustls-ring -> rustls 0.21 + hyper-rustls 0.24 ->
# rustls-webpki 0.101.7, which is GHSA-82j2-j2ch-gfr8 (HIGH, DoS via panic on a
# malformed CRL; patched in 0.103.13) and GHSA-xgp8-3hg3-c2mh. HTTPS does not need
# it: `default-https-client` — also a default, and kept below — routes through
# aws-smithy-http-client/rustls-aws-lc on rustls 0.23. Verified with
# `cargo tree -e features`, which shows both edges arriving at the same crate.
# Updating does not help: the legacy path is still selected at
# aws-smithy-http-client 1.4.0, the latest. Each line below is that crate's own
# default list with `rustls` removed, so nothing else changes.
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-lambda = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudwatch = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudwatchlogs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sesv2 = { version = "1", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
aws-sdk-ec2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-iam = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kinesis = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ecr = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sfn = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-types = "1"
aws-smithy-types = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
base64 = "0.22"
once_cell = "1"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
