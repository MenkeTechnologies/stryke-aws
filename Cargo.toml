[package]
name = "stryke-aws-helper"
version = "0.1.1"
edition = "2021"
description = "AWS bridge binary for the stryke `aws` package."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-aws"
homepage = "https://menketechnologies.github.io/stryke-aws/"
publish = false

[[bin]]
name = "stryke-aws-helper"
path = "src/main.rs"

[dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-dynamodb = "1"
aws-sdk-sqs = "1"
aws-sdk-lambda = "1"
aws-sdk-sts = "1"
aws-types = "1"
aws-smithy-types = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs"] }
clap = { version = "4", default-features = false, features = [
    "std", "derive", "help", "usage", "error-context", "env",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
base64 = "0.22"
url = "2"
http = "1"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
