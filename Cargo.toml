[package]
name = "stryke-aws"
version = "0.2.0"
edition = "2021"
description = "AWS cdylib for stryke. Dlopened in-process with a persistent tokio runtime + per-(region, service) AWS SDK client cache. v0.2.0 covers S3, DynamoDB, SQS, Lambda, STS — focused subset of the v1 helper's surface; remaining ops can be added incrementally."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-aws"
homepage = "https://menketechnologies.github.io/stryke-aws/"
publish = false

[lib]
name = "stryke_aws"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-dynamodb = "1"
aws-sdk-sqs = "1"
aws-sdk-lambda = "1"
aws-sdk-sts = "1"
aws-types = "1"
aws-smithy-types = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
base64 = "0.22"
once_cell = "1"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
